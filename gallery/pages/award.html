    <!-- ================================================================ Adjudicación -->
    <template id="page-award">
      <p class="eyebrow">Componentes</p>
      <h1>Adjudicación <code class="tag">&lt;nx-award&gt;</code></h1>
      <p class="lead">
        60 artículos cotizados por 10 proveedores. La recomendación ya sugirió a quién darle cada artículo (contorno
        punteado y ✦) y esa sugerencia arranca como tu elección (relleno). Un clic en otra celda le da el artículo entero a
        ese proveedor; en el detalle se reparte por cantidad entre varios o se deja sin adjudicar. Nunca más de lo que
        cada uno ofreció ni más de lo pedido. Las alertas llevan a las filas que merecen ojo humano.
      </p>
      <nx-award id="award-demo" heading="RFQ-0412 · Torres del Parque" endpoint="/demo/award" currency="COP" locale="es-CO" require-reason></nx-award>
      <p class="sel-tip">
        Enfoca la tabla y muévete con <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd>; <kbd>Espacio</kbd> elige la celda,
        <kbd>Supr</kbd> vuelve a la sugerencia, <kbd>↵</kbd> sobre un artículo abre su detalle y <kbd>J</kbd>/<kbd>K</kbd>
        saltan a la siguiente alerta. Prueba el cable 12 AWG (una oferta parcial que se reparte), el cemento (un precio
        atípico que no se tuvo en cuenta), sube el peso del plazo en «Criterios», o haz clic en «Metales Unión» y exclúyelo.
        «Grupo Covial» no es elegible.
      </p>
      <ol class="stage__log btn-events" id="award-log"></ol>

      <h2>Cómo funciona</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
          <tbody>
            <tr><td>Celdas</td><td>Tres marcas y nada más: contorno punteado con ✦ (sugerida), relleno (lo elegido) y ámbar (una alerta). Debajo, en pequeño, la cantidad cuando el artículo se reparte, o «≤ 168» si el proveedor ofrece menos de lo pedido. «—» donde no cotizó; tachado, un proveedor no elegible.</td></tr>
            <tr><td>Repartos</td><td>En el detalle, una cantidad por proveedor: lo que escribes gana (hasta lo que ofreció) y, si pasa de lo pedido, ceden los demás. Lo que falta se dice en la fila («faltan 40») y en el resumen. «No adjudicar» deja el artículo fuera de las órdenes.</td></tr>
            <tr><td>Resumen</td><td>El total exacto, lo que cuestan tus cambios frente a la sugerencia (en rojo si suben, en verde si bajan), cuántas órdenes salen y cuántas alertas quedan por abrir. La alerta de un proveedor («póliza por vencer») cuenta en las filas donde se le adjudica.</td></tr>
            <tr><td>Detalle</td><td>Clic en un artículo: sus alertas, la razón de la recomendación, el ranking con el aporte de cada criterio, el precio original antes de normalizar, las cantidades y, si te apartaste, el costo del cambio, el motivo y «Volver a la sugerencia».</td></tr>
            <tr><td>Proveedor</td><td>Clic en su columna: cuántos artículos cotizó y cuántos se le adjudican. «Excluir de la sugerencia» vuelve a pedir la recomendación sin él; «Darle todo lo que cotizó» consolida con un clic y se deshace con otro.</td></tr>
            <tr><td>Recomendación</td><td>Mover un peso o excluir la vuelve a pedir (con <code>endpoint</code> o <code>adjustable</code>). Si falla, se corta o vence el plazo, sigue la anterior, con sus pesos, y se puede reintentar. Si mueve lo que seguía a la sugerencia, lo avisa y lo marca un momento.</td></tr>
            <tr><td>Motivo y envío</td><td>Al pie, el motivo de la decisión (obligatorio con <code>require-motive</code>). «Generar órdenes» lleva antes a lo que falta; mientras la app guarda (<code>wait()</code>) dice «Generando…» y no envía dos veces.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Protocolo</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
          <tbody>
            <tr><td><code>POST endpoint</code></td><td><code>{weights: {criterio: peso}, excluded: [proveedor]}</code> → NDJSON (o <code>data:</code> de SSE), un evento por línea. Se pide al conectar, al mover un peso (con espera) y al excluir; nunca en <code>readonly</code>. Plazo: <code>timeout</code> (60 s).</td></tr>
            <tr><td><code>recommend</code></td><td><code>{"type":"recommend","item","supplier"}</code> (entero a uno) o <code>{"type":"recommend","item","allocations":[{supplier, qty}]}</code> (un reparto), con <code>reason?</code> y <code>ranking?: [{supplier, score, scores?}]</code>. Sin proveedor: no hay a quién sugerir.</td></tr>
            <tr><td><code>flag</code></td><td><code>{"type":"flag","item","supplier?","message","tone?"}</code> (<code>warning</code> por defecto, <code>danger</code>, <code>neutral</code>). Con <code>supplier</code>, también se marca su celda.</td></tr>
            <tr><td><code>scenario</code></td><td><code>{"type":"scenario","id","label","detail?","picks":{artículo: proveedor}}</code>.</td></tr>
            <tr><td><code>note</code>, <code>error</code>, <code>done</code></td><td>Avisos sobre la tabla. Sin <code>done</code> (la conexión se cortó) o con <code>error</code>, vuelve la recomendación anterior. Al terminar bien, lo que no volvió a mandar desaparece.</td></tr>
            <tr><td><code>nx-award-advise</code></td><td>Sin <code>endpoint</code>: <code>{weights, excluded, respond(events)}</code>. O asigna la prop <code>advice</code> con los mismos eventos.</td></tr>
            <tr><td><code>nx-award-change</code></td><td><code>{kind, item, items, value, choices, weights, excluded, scenario, motive}</code>: el estado completo, para guardar un borrador. <code>kind: "advice"</code> si fue una recomendación nueva; los cambios del comprador emiten además un <code>change</code> nativo.</td></tr>
            <tr><td><code>nx-award-submit</code></td><td><code>{value: [{item, supplier, qty}], orders, changes, followed, total, unassigned, partial, motive, scenario, weights, excluded, pending, key, wait(promesa)}</code>.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-award id="rfq" heading="RFQ-0412" currency="COP" require-reason require-motive&gt;&lt;/nx-award&gt;
&lt;script&gt;
rfq.suppliers = [{ id: "ferrecaribe", name: "Ferrecaribe", detail: "★ 4,6 · 5 d" }, …];

rfq.quotes = [{ item: "A15", supplier: "ferrecaribe", price: 18500, offered: 200, leadTime: 5 }, …];
rfq.advice = propuesta; // [{type: "recommend", item: "A15", allocations: [{supplier: "ferrecaribe", qty: 200}, …]}, …]

    method: "POST",
    headers: { "Content-Type": "application/json", "Idempotency-Key": e.detail.key },
    body: JSON.stringify({ allocations: e.detail.value, motive: e.detail.motive, changes: e.detail.changes }),
  }).then((r) =&gt; { if (!r.ok) throw new Error("No se pudo adjudicar."); })));
&lt;/script&gt;</code></pre>

      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>suppliers</code>, <code>items</code>, <code>quotes</code></td><td><code>[{id, name, detail?, alert?, blocked?}]</code>, <code>[{id, name, qty?, qtyText?, unit?, code?, group?}]</code> y <code>[{item, supplier, price, offered?, leadTime?, original?, note?}]</code>. <code>price</code> es el unitario comparable; <code>offered</code>, cuánto ofrece (sin él, todo). Sin <code>qty</code> (lo pedido es un texto), el artículo no se reparte.</td></tr>
            <tr><td><code>criteria</code>, <code>weights</code></td><td><code>[{id, label, weight}]</code>: la leyenda del puntaje y los deslizadores de «Criterios» (con <code>endpoint</code> o <code>adjustable</code>). <code>weights</code>: todos juntos en cualquier escala; unos pocos, en la de los deslizadores (0–100).</td></tr>
            <tr><td><code>advice</code></td><td>La recomendación como eventos del protocolo, sin servidor. Leerla devuelve la de ahora.</td></tr>
            <tr><td><code>value</code>, <code>choices</code></td><td>Lo adjudicado <code>[{item, supplier, qty?}]</code> (asignarlo lo fija tal cual: una adjudicación cerrada) y lo que decidió el comprador <code>[{item, allocations, reason?}]</code> (un borrador; lo demás sigue a la sugerencia).</td></tr>
            <tr><td><code>motive</code>, <code>excluded</code>, <code>scenario</code>, <code>filter</code>, <code>lens</code></td><td>El motivo de la decisión, los proveedores fuera de la sugerencia, el escenario aplicado, las filas visibles (<code>all</code>, <code>alerts</code>, <code>changed</code>) y lo que muestran las celdas (<code>price</code>, <code>total</code>, <code>lead</code>, <code>score</code>).</td></tr>
            <tr><td><code>endpoint</code>, <code>adjustable</code>, <code>timeout</code>, <code>heading</code>, <code>currency</code>, <code>reasons</code>, <code>locale</code>, <code>labels</code></td><td>URL de la recomendación, la app que responde <code>nx-award-advise</code> cada vez, el plazo, título, moneda, motivos sugeridos, formato y textos.</td></tr>
            <tr><td><code>readonly</code>, <code>require-reason</code>, <code>require-review</code>, <code>require-motive</code></td><td>Solo consulta (sin pedir recomendación); apartarse pide motivo; las alertas se abren antes de generar; el motivo de la decisión es obligatorio.</td></tr>
            <tr><td><code>dirty</code>, <code>submitting</code></td><td>Cambios del comprador sin guardar (se apaga al terminar bien un <code>wait()</code>) y la app guardando.</td></tr>
            <tr><td><code>submit()</code>, <code>next(dir?)</code>, <code>open(item)</code>, <code>refresh()</code></td><td>Generar las órdenes, ir a la siguiente alerta, abrir un detalle y volver a pedir la recomendación.</td></tr>
            <tr><td>Teclado</td><td>Grilla con un solo punto de tabulación: flechas, <kbd>Inicio</kbd>/<kbd>Fin</kbd> (con <kbd>Ctrl</kbd>, de la grilla), <kbd>RePág</kbd>/<kbd>AvPág</kbd>. <kbd>Espacio</kbd> o <kbd>↵</kbd> eligen; sobre un artículo abren el detalle y sobre un proveedor, su barra. <kbd>Supr</kbd> vuelve a la sugerencia, <kbd>J</kbd>/<kbd>K</kbd> saltan entre alertas y <kbd>Esc</kbd> cierra el detalle.</td></tr>
          </tbody>
        </table>
      </div>
    </template>
