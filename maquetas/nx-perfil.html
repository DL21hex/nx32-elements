  "edit-save": (b) => saveGroup(b.dataset.g),
  "ver-ok": () => { if (checkCode($("#ver-form"))) { const cb = VERIFY_OK; VERIFY_OK = null; cb && cb(); } },
  salary: () => { UI.salaryShown = !UI.salaryShown; renderContent(); const b = $("[data-act=salary]"); b && b.focus(); },
  report: () => openReport("corregir"),
  "report-del": () => openReport("borrar"),
  "rep-save": () => {
    const v = validate($("#rep-form"), REP.schema);
    if (!v) return;
    const n = `PQR-2026-${1180 + HIST.length}`;
    logChange(REP.kind === "borrar" ? `Pediste borrar: ${v.field}` : `Reportaste un error en «${v.field}»`, "", n);
    closeSheet(); render();
    toast(`Enviado a Talento Humano con el radicado ${n}.`);
  },
  "bank-cancel": () => {
    const prev = P.bankPending, doc = docById("banco"), docPrev = { ...doc };
    P.bankPending = null;
    Object.assign(doc, { status: "ok", okText: "Vigente", note: "", read: [["Banco", P.bank.name], ["Tipo", P.bank.type], ["Número", `•••• ${P.bank.number}`]], added: ["2021-02-03", "Talento Humano"] });
    logChange("Cancelaste el cambio de cuenta", `${prev.name} •••• ${prev.number}`, `${P.bank.name} •••• ${P.bank.number}`);
    render();
    toast("Cancelaste la solicitud. El pago sigue llegando a Bancolombia.", { label: "Deshacer", run: () => { P.bankPending = prev; Object.assign(doc, docPrev); HIST.shift(); render(); } });
  },
  "bank-change": () => openBank(),
  "bank-verify": () => { if (checkCode($("#bank-form"))) { BANK.step = 2; paintBank(); } },
  "bank-send": () => {
    const v = validate($("#bank-form"), BANK_SCHEMA);
    if (!v) return;
    const num = v.number.replace(/\D/g, "");
    P.bankPending = { name: v.bank, type: v.type, number: num.slice(-4), sent: TODAY_ISO };
    Object.assign(docById("banco"), { status: "review", note: "Va con el cambio de cuenta", read: [["Banco", v.bank], ["Tipo", v.type], ["Número", `•••• ${num.slice(-4)}`], ["Titular", `${P.first} ${P.last}`]], added: [TODAY_ISO, "ti"] });
    logChange("Cuenta de nómina", `${P.bank.name} •••• ${P.bank.number}`, `${v.bank} •••• ${num.slice(-4)} (en revisión)`);
    logActivity("Pediste cambiar la cuenta de nómina");
    closeSheet(); render();
    toast("Enviado a Nómina. Te avisamos cuando quede.");
  },

  /* núcleo familiar */
  "fam-add": () => openFam(null),
  "fam-edit": (b) => openFam(b.dataset.id),
  "fam-fill": (b) => {
    b.setAttribute("aria-busy", "true"); b.disabled = true;
    $("#fill-msg").textContent = "Leyendo registro-civil-emilia.pdf…";
    later(() => {
      b.removeAttribute("aria-busy"); b.disabled = false;
      const r = fillForm($("#fam-form"), { rel: "Hijo(a)", first: "Emilia", last: "Pérez Gómez", docType: "RC", doc: "1036998812", birth: "2026-09-18", sex: "Femenino", proof: "registro-civil-emilia.pdf" }, "Registro civil");
      $("#fill-msg").textContent = `Llené ${r.n} datos del registro civil${r.kept ? ` y respeté ${r.kept} que ya escribiste` : ""}. Elige para qué la registras.`;
    }, 900);
  },
  "fam-save": (b) => {
    const form = $("#fam-form");
    const v = validate(form, FAM_SCHEMA);
    if (!v) return;
    const id = b.dataset.id;
    const uses = v.uses || [];
    const rec = { rel: v.rel, first: v.first, last: v.last, docType: v.docType, doc: v.doc.replace(/\D/g, ""), birth: v.birth, sex: v.sex, eps: uses.includes("eps"), ccf: uses.includes("ccf"), dep: uses.includes("dep"), cell: (v.cell || "").replace(/\D/g, ""), proof: v.proof ? (/^registro-civil/i.test(v.proof) ? "Registro civil de nacimiento" : v.proof) : "" };
    rec.married = rec.rel === "Cónyuge o compañero(a)" && /^Casad/.test(P.civil);
    let f;
    if (id) {
      f = FAM.find((x) => x.id === id);
      const newAff = (rec.eps && !f.eps) || (rec.ccf && !f.ccf);
      Object.assign(f, rec);
      if (newAff) f.pending = "Afiliación en trámite";
      logChange(`Actualizaste a ${f.first} ${f.last}`);
    } else {
      f = { id: fold(rec.first).replace(/\W+/g, "") + Date.now().toString(36), ...rec, pending: rec.eps || rec.ccf ? "Afiliación en trámite" : "" };
      FAM.push(f);
      logChange(`Agregaste a ${f.first} ${f.last} (${relLabel(f).toLowerCase()})`);
    }
    if (uses.includes("emergency")) P.emergency = f.id;
    else if (P.emergency === f.id) P.emergency = (FAM.find((x) => x.cell && x.id !== f.id) || {}).id || "";
    UI.newId = f.id;
    closeSheet(); render();
    $("#fam-" + f.id)?.scrollIntoView?.({ block: "center", behavior: "smooth" });
    toast(id ? "Guardado." : f.pending ? `Agregaste a ${f.first}. Talento Humano tramita su afiliación y te avisa.` : `Agregaste a ${f.first}.`);
  },
  "fam-remove": (b) => { UI.confirmRemove = b.dataset.id; renderContent(); $(`#fam-${b.dataset.id} .ent__confirm .btn`)?.focus(); },
  "remove-no": () => { UI.confirmRemove = null; UI.confirmConsent = null; renderContent(); },
  "fam-remove-yes": (b) => {
    const i = FAM.findIndex((x) => x.id === b.dataset.id);
    const [f] = FAM.splice(i, 1);
    const wasEm = P.emergency === f.id;
    if (wasEm) P.emergency = (FAM.find((x) => x.cell) || {}).id || "";
    UI.confirmRemove = null;
    logChange(`Quitaste a ${f.first} ${f.last} de tu núcleo familiar`);
    render();
    toast(`Quitaste a ${f.first.split(" ")[0]}.`, { label: "Deshacer", run: () => { FAM.splice(i, 0, f); if (wasEm) P.emergency = f.id; HIST.shift(); render(); } });
  },

  /* hoja de vida */
  "cv-add": (b) => openCv(b.dataset.list, null),
  "cv-edit": (b) => openCv(b.dataset.list, b.dataset.id),
  "cv-save": (b) => {
    const list = b.dataset.list, id = b.dataset.id;
    const v = validate($("#cv-form"), CV_SCHEMA[list].fields);
    if (!v) return;
    if (v.proof && !/^(Certificado|Diploma)/.test(v.proof)) v.proof = list === "exp" ? "Certificado laboral" : list === "edu" ? "Diploma y acta de grado" : "Certificado";
    let x;
    if (id) { x = CV[list].find((e) => e.id === id); Object.assign(x, v); }
    else { x = { id: list + Date.now().toString(36), ...v }; CV[list].unshift(x); }
    if (list === "exp") CV.exp.sort((a, c) => (a.from < c.from ? 1 : -1));
    UI.newId = x.id;
    logChange(id ? `Actualizaste tu hoja de vida: ${x.role || x.title || x.name || x.lang}` : `Agregaste a tu hoja de vida: ${x.role || x.title || x.name || x.lang}`);
    closeSheet(); render();
    toast(id ? "Guardado." : "Agregado a tu hoja de vida.");
  },
  "cv-remove": (b) => { UI.confirmRemove = b.dataset.id; renderContent(); },
  "cv-remove-yes": (b) => {
    const list = CV[b.dataset.list];
    const i = list.findIndex((e) => e.id === b.dataset.id);
    const [x] = list.splice(i, 1);
    UI.confirmRemove = null;
    render();
    toast("Quitado de tu hoja de vida.", { label: "Deshacer", run: () => { list.splice(i, 0, x); render(); } });
  },
  "cv-import": () => openCvImport(),
  "imp-sample": () => importRead("hoja-de-vida-laura.pdf"),
  "imp-add": () => {
    const picked = $$("#imp-list input").filter((c) => c.checked).map((c) => IMPORT[Number(c.value)]);
    picked.forEach((p) => CV[p.list].push(p.item));
    if (picked.length) { UI.newId = picked[0].item.id; logChange(`Agregaste ${picked.length} datos desde tu hoja de vida en PDF`); }
    closeSheet(); render();
    toast(picked.length ? `Agregué ${picked.length} a tu hoja de vida.` : "No agregué nada.");
  },
  "skill-rm": (b) => { const s = CV.skills.splice(Number(b.dataset.i), 1)[0]; renderContent(); toast(`Quitaste «${s}».`); },

  /* documentos */
  doc: (b) => openDoc(b.dataset.id),
  upload: (b) => openUpload(b.dataset.doc),
  handoff: () => {
    $("#handoff").innerHTML = `<div class="handoff"><div class="qr"${piece("QR de nx-handoff", "existe")}><canvas id="qr" width="29" height="29" aria-label="Código QR de muestra"></canvas></div><div><strong>Escanéalo con la cámara del celular</strong><p class="muted small">Se abre la cámara y la foto llega aquí sola. El enlace vence en <span id="qr-left" class="num">10:00</span>.</p><p class="handoff__st"><i class="pulse"></i><span id="ho-st">Esperando el celular…</span></p><button class="lnk" type="button" data-act="handoff-sim">Simular: el celular manda la foto</button></div></div>`;
    drawQR($("#qr"), "nx-handoff-" + UP.id);
    let left = 600;
    const tick = () => { left--; const el = $("#qr-left"); if (!el) return; el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; if (left > 0) later(tick, 1000); };
    later(tick, 1000);
    $("[data-act=handoff-sim]").focus();
  },
  "handoff-sim": () => {
    $("#ho-st").textContent = "iPhone de Laura conectado";
    later(() => { $("#ho-st").textContent = "Recibiendo 1 foto…"; later(() => upRead("foto-desde-el-celular.jpg"), 700); }, 600);
  },
  "up-again": () => { $("#up-result").hidden = true; $("#up-stage").hidden = false; $("#sheet-foot [data-act=up-save]").disabled = true; const f = $("#up-file"); f.value = ""; f.focus(); },
  "up-save": () => {
    const d = docById(UP.id);
    const out = UP.out || { read: [], checks: [] };
    const wasMissing = d.status === "missing";
    d.status = "ok"; d.read = out.read; d.checks = out.checks; d.added = [TODAY_ISO, "ti"];
    if (out.apply) out.apply(d);
    if (d.id === "cert-sofia") { d.okText = "Vigente · año 2026"; d.asked = ["Caja de compensación"]; d.uses = [[TODAY_ISO, "Caja de compensación", "Cuota monetaria de Sofía"]]; }
    if (d.id === "rut") d.okText = "Vigente";
    logChange(`${wasMissing ? "Subiste" : "Reemplazaste"}: ${d.name}`);
    closeSheet(); render();
    const card = $("#doc-" + d.id); if (card) { card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
    toast(d.id === "cert-sofia" ? "Guardado y enviado a la caja de compensación." : `Guardado: ${d.name}.`);
  },
  sign: () => openSign(),
  "sig-clear": () => { if (SIG && SIG.ctx) { SIG.ctx.clearRect(0, 0, SIG.c.width, SIG.c.height); SIG.drawn = false; } },
  "sig-type": () => {
    if (!SIG || !SIG.ctx) return;
    const { ctx, c } = SIG;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#1d2a4d";
    ctx.font = "italic 104px 'Segoe Script', 'Brush Script MT', 'Snell Roundhand', cursive";
    ctx.fillText(`${P.first.split(" ")[0]} ${P.last.split(" ")[0]}`, 60, 230);
    SIG.drawn = true; SIG.typed = true;
  },
  "sig-save": () => {
    if (!SIG || !SIG.drawn) { toast("Firma primero en el recuadro."); return; }
    try { SIG_IMG = SIG.c.toDataURL("image/png"); } catch (e) { SIG_IMG = null; }
    const d = docById("firma"); d.added = [TODAY_ISO, "ti"]; d.okText = SIG.typed ? "Guardada (escrita)" : "Guardada";
    logChange("Cambiaste tu firma");
    closeSheet(); render();
    toast("Guardaste tu firma. Las actas nuevas usarán esta.");
  },

  /* seguridad */
  "susp-yes": () => { UI.susp = false; const s = SEC.sessions.find((x) => x.id === "s3"); if (s) s.odd = false; render(); toast("Listo. Ese equipo queda como tuyo."); },
  "susp-no": () => {
    UI.susp = false;
    SEC.sessions = SEC.sessions.filter((x) => x.id !== "s3");
    logActivity("Cerraste la sesión de Edge en Windows · Bogotá");
    render();
    openPwd("Cerramos la sesión de Bogotá. Cambia la contraseña ahora y activa la verificación en dos pasos.");
  },
  pwd: () => openPwd(""),
  "pw-toggle": (b) => {
    const inp = b.parentElement.querySelector("input");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    b.setAttribute("aria-pressed", String(show));
    b.setAttribute("aria-label", show ? "Ocultar la contraseña" : "Mostrar la contraseña");
    b.innerHTML = ic(show ? "eye-off" : "eye", "i--sm");
  },
  "pwd-save": () => {
    const form = $("#pwd-form");
    const v = validate(form, [
      { k: "cur", req: true, t: "password" },
      { k: "new", req: true, t: "password", check: (x, all) => { const r = pwRules(x, all.cur); return Object.values(r).every(Boolean) ? "" : "Todavía no cumple las condiciones de abajo"; } },
      { k: "rep", req: true, t: "password", check: (x, all) => (x !== all.new ? "No coincide con la nueva" : "") },
    ]);
    if (!v) return;
    const closed = v.others ? SEC.sessions.filter((x) => !x.current).length : 0;
    if (v.others) SEC.sessions = SEC.sessions.filter((x) => x.current);
    SEC.pwdChanged = TODAY_ISO;
    logActivity("Cambiaste la contraseña");
    closeSheet(); render();
    toast(closed ? `Cambiaste la contraseña y cerraste ${closed} ${closed === 1 ? "sesión" : "sesiones"}.` : "Cambiaste la contraseña.");
  },
  mfa: () => openMfa(),
  "mfa-next": () => { MFA.method = ($$("input[name=mfa-m]").find((r) => r.checked) || {}).value || "app"; MFA.step = 2; paintMfa(); },
  "mfa-back": () => { MFA.step = 1; paintMfa(); },
  "mfa-verify": () => { if (checkCode($("#mfa-form"))) { MFA.step = 3; paintMfa(); } },
  "mfa-done": () => {
    SEC.mfa = { method: MFA.method, since: TODAY_ISO, codes: 10 };
    logActivity("Activaste la verificación en dos pasos");
    logChange("Verificación en dos pasos", "Apagada", MFA.method === "app" ? "App autenticadora" : "Mensaje de texto");
    closeSheet(); render();
    toast("Activaste la verificación en dos pasos.");
  },
  "mfa-codes": () => {
    const codes = genCodes();
    openSheet({ title: "Códigos de respaldo", sub: "Cada uno sirve una sola vez", body: `<div class="codes">${codes.map((c) => `<span>${c}</span>`).join("")}</div><p class="muted small">Al generar códigos nuevos, los anteriores dejan de servir.</p>`, foot: `<span class="grow"></span><button class="btn" type="button" data-act="copy" data-text="${codes.join(" ")}">${ic("copy", "i--sm")}Copiar</button><button class="btn btn--primary" type="button" data-act="sheet-close">Listo</button>`, focus: false });
  },
  passkey: (b) => {
    b.setAttribute("aria-busy", "true"); b.disabled = true; b.textContent = "Esperando a tu equipo…";
    setTimeout(() => { SEC.passkeys.push({ name: "Chrome en Linux", at: TODAY_ISO }); logActivity("Creaste una llave de acceso"); render(); toast("Creaste una llave de acceso para este equipo."); }, 1300);
  },
  "go-contact": () => { UI.editing = "contacto"; go("empleado", "g-contacto"); $("#f-emailPersonal")?.focus({ preventScroll: true }); },
  "sess-close": (b) => {
    const s = SEC.sessions.find((x) => x.id === b.dataset.id);
    SEC.sessions = SEC.sessions.filter((x) => x !== s);
    if (s.id === "s3") UI.susp = false;
    logActivity(`Cerraste la sesión de ${s.name} · ${s.place}`);
    render();
    toast(`Cerraste la sesión de ${s.name}.`);
  },
  "sess-close-all": () => { const n = SEC.sessions.filter((x) => !x.current).length; SEC.sessions = SEC.sessions.filter((x) => x.current); UI.susp = false; logActivity(`Cerraste ${n} sesiones`); render(); toast(`Cerraste ${n} ${n === 1 ? "sesión" : "sesiones"}. Este equipo sigue dentro.`); },

  /* privacidad */
  policy: () => openSheet({ title: "Política de tratamiento de datos", sub: "Versión de 2020 · aceptada el 3 feb 2021", body: `<p>Crear Colombia S.A.S. trata tus datos para administrar tu contrato, tu nómina, tu seguridad social y tu bienestar. Puedes conocerlos, actualizarlos, rectificarlos y pedir que se borren los que la ley no obliga a conservar.</p><p class="muted small">Texto de muestra para la maqueta.</p>`, foot: `<span class="grow"></span><button class="btn btn--primary" type="button" data-act="sheet-close">Cerrar</button>`, focus: false }),
  "consent-off": (b) => { UI.confirmConsent = b.dataset.id; renderContent(); },
  "consent-off-yes": (b) => {
    const c = PRIV.consents.find((x) => x.id === b.dataset.id);
    c.on = false; c.d = `La retiraste el ${fDate(TODAY_ISO)}`; UI.confirmConsent = null;
    logChange(`Retiraste la autorización: ${c.t}`);
    render(); toast("Retiraste la autorización.");
  },
  "consent-on": (b) => {
    const c = PRIV.consents.find((x) => x.id === b.dataset.id);
    c.on = true; c.d = `Aceptada el ${fDate(TODAY_ISO)}`;
    logChange(`Aceptaste: ${c.t}`);
    render(); toast("Aceptada.");
  },
  "data-dl": (b) => {
    b.setAttribute("aria-busy", "true"); b.disabled = true;
    setTimeout(() => { b.removeAttribute("aria-busy"); b.disabled = false; logChange("Descargaste todos tus datos"); toast("En nx32 aquí se descarga un .zip con tus datos en JSON y en PDF."); }, 1200);
  },
  "go-priv": () => go("privacidad"),
};

/* ================================================================ eventos */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (!fn) return;
  if (b.tagName === "A") e.preventDefault();
  fn(b, e);
});
document.addEventListener("submit", (e) => {
  const f = e.target;
  e.preventDefault();
  if (f.dataset.form === "skill") {
    const inp = $("#skill-new"), s = inp.value.trim();
    if (!s) return;
    if (CV.skills.some((x) => fold(x) === fold(s))) { toast(`«${s}» ya está.`); return; }
    CV.skills.push(s);
    renderContent();
    $("#skill-new").focus();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "theme") { if (t.value) document.body.dataset.theme = t.value; else delete document.body.dataset.theme; }
  if (t.dataset.vis) { PRIV.show[t.dataset.vis] = t.checked; $("#dircard").outerHTML = dirCard(); flashSaved("vis-saved"); }
  if (t.dataset.notif) { NOTIF.find((n) => n.id === t.dataset.notif)[t.dataset.ch] = t.checked; renderIdx(); flashSaved("notif-saved"); }
  if (t.id === "quiet") { QUIET = t.checked; flashSaved("notif-saved"); }
});
$("#photo-input").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { P.photo = r.result; logChange("Cambiaste tu foto"); render(); toast(PRIV.show.photo ? "Foto actualizada. Tus compañeros la ven en el directorio." : "Foto actualizada. Está oculta para tus compañeros."); };
  r.readAsDataURL(f);
  e.target.value = "";
});
$("#idx").addEventListener("keydown", (e) => {
  const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
  if (step === undefined && e.key !== "Home" && e.key !== "End") return;
  e.preventDefault();
  const i = SECTIONS.findIndex((s) => s.id === UI.sec);
  const j = e.key === "Home" ? 0 : e.key === "End" ? SECTIONS.length - 1 : (i + step + SECTIONS.length) % SECTIONS.length;
  go(SECTIONS[j].id);
  $("#tab-" + SECTIONS[j].id).focus();
});
$("#sheet-bk").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#sheet").hidden) { e.preventDefault(); closeSheet(); }
  else if (e.key === "Escape" && UI.editing) ACT["edit-cancel"]();
});
/* Atrapar el foco en el panel (nx-dialog lo hace con <dialog>). */
$("#sheet").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const f = $$("#sheet button:not([disabled]), #sheet input:not([disabled]), #sheet select, #sheet textarea, #sheet a[href]").filter((el) => !el.closest("[hidden]") && el.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

/* ================================================================ arranque */
const start = location.hash.replace("#", "");
if (SECTIONS.some((s) => s.id === start)) UI.sec = start;
render();
window.__perfil = { P, FAM, CV, DOCS, SEC, PRIV, NOTIF, HIST, UI, ACT, missing, secStatus, render, go };
})();
</script>
